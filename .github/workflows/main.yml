name: AceAnalytics — Bot Tennis

on:
  workflow_dispatch:   # Déclenché uniquement par cron-job.org ou manuellement

permissions:
  contents: write

# v7.4 : file d'attente — si deux déclenchements se chevauchent, le second
# ATTEND la fin du premier au lieu de tourner en parallèle (évite les conflits
# d'écriture sur stats.json / pari_en_cours.json). cancel-in-progress: false
# garantit qu'aucun run n'est JAMAIS annulé par un autre.
concurrency:
  group: aceanalytics-bot
  cancel-in-progress: false

jobs:
  automation-tennis:
    runs-on: ubuntu-latest
    timeout-minutes: 30   # v7.4.1 : vérification (≤8 paris × ~60s) + bot avec relais Gemini ≈ 15-20 min possibles

    env:
      ANTHROPIC_API_KEY:   ${{ secrets.ANTHROPIC_API_KEY }}
      GEMINI_API_KEY:      ${{ secrets.GEMINI_API_KEY }}
      TELEGRAM_BOT_TOKEN:  ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHANNEL_ID: ${{ secrets.TELEGRAM_CHANNEL_ID }}
      # v9.0 : identifiant Telegram PERSONNEL — les alertes techniques (crédits
      # API épuisés) y sont envoyées en privé au lieu du canal public.
      # Prérequis : avoir envoyé /start au bot depuis ce compte, sinon Telegram
      # refuse l'envoi. Sans ce secret, les alertes partent sur le canal.
      TELEGRAM_ADMIN_ID:   ${{ secrets.TELEGRAM_ADMIN_ID }}
      GITHUB_TOKEN:        ${{ secrets.GITHUB_TOKEN }}
      GITHUB_REPO:         ${{ github.repository }}
      ODDS_API_KEY:        ${{ secrets.ODDS_API_KEY }}
      RAPIDAPI_KEY:        ${{ secrets.RAPIDAPI_KEY }}
      # v7.7 : clé du compte OddsPapi DIRECT (api.oddspapi.io, pool séparé de
      # RapidAPI). Repli fixtures/cotes sur 429, et 2e voie déterministe de
      # règlement dans verification_resultats.py.
      # ⚠️ Sans cette ligne, le secret existe mais le script ne le voit pas.
      ODDSPAPI_KEY:        ${{ secrets.ODDSPAPI_KEY }}

    steps:
      - name: "Checkout du dépôt"
        uses: actions/checkout@v5
        with:
          ref: ${{ github.ref_name }}

      - name: "Configuration de Python 3.12"
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: "Installation des dépendances"
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: "Étape 1 — Vérification des résultats précédents"
        run: python verification_resultats.py

      - name: "Étape 2 — Collecte Gemini + Analyse Claude + Envoi Telegram"
        run: python bot.py
