name: Bot Pronostics Tennis

on:
  schedule:
    # 06:00 UTC = 08:00 heure française (en heure d'été)
    - cron: '0 6 * * *'
    # 12:00 UTC = 14:00 heure française
    - cron: '0 12 * * *'
  workflow_dispatch: # Permet de lancer le bot manuellement depuis l'interface GitHub

# CRUCIAL : Donne l'autorisation au bot de faire des "git push" pour les statistiques
permissions:
  contents: write

jobs:
  run-bot:
    runs-on: ubuntu-latest
    
    # Centralisation des variables d'environnement pour tous les scripts
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHANNEL_ID: ${{ secrets.TELEGRAM_CHANNEL_ID }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip' # Optimisation : met en cache les dépendances pour aller plus vite

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests google-genai

      - name: 1. Vérification du pari précédent
        # On exécute le script de l'Oracle en premier pour valider les stats
        # Remplace 'verifier.py' par le nom réel de ton second fichier script
        run: python verifier.py

      - name: 2. Génération du nouveau pronostic
        # Ensuite, on cherche une nouvelle opportunité
        run: python bot.py
