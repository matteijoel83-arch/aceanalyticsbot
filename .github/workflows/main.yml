name: Run Tennis Bot Autonome

on:
  schedule:
    # Se déclenche tous les jours à 7h00 UTC (9h00 du matin en France en été)
    - cron: '0 7 * * *'
  workflow_dispatch: # Te permet de lancer le bot manuellement d'un simple clic pour tester !

jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le code du dépôt
        uses: actions/checkout@v4

      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Installer les dépendances
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Exécuter le Bot
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: python bot.py
