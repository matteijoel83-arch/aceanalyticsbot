name: Bot Pronostics & Vérifications Tennis

on:
  schedule:
    # 06:00 UTC = 08:00 Heure Française
    - cron: '0 6 * * *'
    # 12:00 UTC = 14:00 Heure Française
    - cron: '0 12 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  automation-tennis:
    runs-on: ubuntu-latest
    
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHANNEL_ID: ${{ secrets.TELEGRAM_CHANNEL_ID }}

    steps:
      - name: "Checkout du dépôt"
        uses: actions/checkout@v4

      - name: "Configuration de Python"
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: "Installation des dépendances"
        run: pip install requests google-genai

      - name: "Étape 1 : Vérification du résultat précédent"
        run: python verification_resultats.py

      - name: "Étape 2 : Génération du nouveau pronostic"
        run: python bot.py
