name: AceAnalytics — Bot Tennis

on:
  workflow_dispatch:   # Déclenché uniquement par cron-job.org ou manuellement

permissions:
  contents: write

jobs:
  automation-tennis:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      ANTHROPIC_API_KEY:   ${{ secrets.ANTHROPIC_API_KEY }}
      GEMINI_API_KEY:      ${{ secrets.GEMINI_API_KEY }}
      TELEGRAM_BOT_TOKEN:  ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHANNEL_ID: ${{ secrets.TELEGRAM_CHANNEL_ID }}
      GITHUB_TOKEN:        ${{ secrets.GITHUB_TOKEN }}
      GITHUB_REPO:         ${{ github.repository }}
      ODDS_API_KEY:        ${{ secrets.ODDS_API_KEY }}
      RAPIDAPI_KEY:        ${{ secrets.RAPIDAPI_KEY }}

    steps:
      - name: "Checkout du dépôt"
        uses: actions/checkout@v4.2.2
        with:
          ref: ${{ github.ref_name }}

      - name: "Configuration de Python 3.12"
        uses: actions/setup-python@v5.6.0
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: "Installation des dépendances"
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: "Étape 1 — Vérification des résultats précédents"
        run: python verification_resultats.py

      - name: "Étape 2 — Collecte Gemini + Analyse Claude + Envoi Telegram"
        run: python bot.py
