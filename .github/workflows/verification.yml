name: Vérification Résultats
on:
  schedule:
    - cron: '45 5 * * *'  # Ajusté pour passer avant le bot de 06:00
    - cron: '45 11 * * *' # Ajusté pour passer avant le bot de 12:00
  workflow_dispatch:

permissions:
  contents: write  # OBLIGATOIRE pour permettre le git push

jobs:
  verification:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: pip install requests google-genai
      - name: Run Verification
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHANNEL_ID: ${{ secrets.TELEGRAM_CHANNEL_ID }}
        run: python verification_resultats.py
