name: AceAnalytics — Récap Hebdo

on:
  schedule:
    # Dimanche 20h00 UTC = 22h00 Paris (heure d'été). Bilan de la semaine écoulée.
    - cron: '0 20 * * 0'
  workflow_dispatch:   # Déclenchement manuel possible

permissions:
  contents: write

# Même groupe que le bot principal : le récap attend la fin d'un run en cours
# au lieu de lire stats.json pendant qu'il est en cours d'écriture.
concurrency:
  group: aceanalytics-bot
  cancel-in-progress: false

jobs:
  recap-hebdo:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    env:
      ANTHROPIC_API_KEY:   ${{ secrets.ANTHROPIC_API_KEY }}
      GEMINI_API_KEY:      ${{ secrets.GEMINI_API_KEY }}
      TELEGRAM_BOT_TOKEN:  ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHANNEL_ID: ${{ secrets.TELEGRAM_CHANNEL_ID }}
      GITHUB_TOKEN:        ${{ secrets.GITHUB_TOKEN }}
      GITHUB_REPO:         ${{ github.repository }}
      ODDS_API_KEY:        ${{ secrets.ODDS_API_KEY }}
      RAPIDAPI_KEY:        ${{ secrets.RAPIDAPI_KEY }}

    steps:
      - name: "Checkout du dépôt"
        uses: actions/checkout@v4.2.2
        with:
          ref: ${{ github.ref_name }}

      - name: "Configuration de Python 3.12"
        uses: actions/setup-python@v5.6.0
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: "Installation des dépendances"
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: "Envoi du récap hebdomadaire Telegram"
        run: python bot.py recap
